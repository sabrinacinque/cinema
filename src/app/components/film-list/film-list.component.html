<!-- app.component.html -->
<div class="container-fluid py-5">
  <h1 class="text-white text-center">BENVENUTI NEL PORTALE DI</h1>

  <div class="text-center mb-5 pb-5">
    <a routerLink="/" alt="Logo cinemando">
      <img
        src="../../../assets/images/logoGrande.png"
        class="img-fluid my-logo"
        alt="Logo cinemando"
      />
    </a>
    <h2>PROGRAMMAZIONE DELLA SETTIMANA</h2>
  </div>

  <div class="position-relative pb-5">
    <!-- Bottone sinistro -->
    <button
      class="btn btn-outline-light carousel-nav-btn position-absolute top-50 start-0 translate-middle-y"
      (click)="scrollLeft()"
    >
      <i class="bi bi-chevron-left fs-3"></i>
    </button>

    <!-- Carosello scrollabile -->
    <div
      #carousel
      class="d-flex flex-nowrap overflow-auto mx-1 mx-md-5 align-items-stretch carousel-container"
      style="scroll-behavior: smooth"
    >
      <ng-container *ngFor="let loop of loopArray">
        <div
          *ngFor="let film of filmList"
          class="card bg-dark text-white mb-3 carousel-card border border-2 border-danger me-2"
        >
          <!-- Solo l’immagine su tutti i dispositivi -->
          <a [routerLink]="['/film', film.id]">
            <img
              [src]="'assets/images/' + film.locandina"
              class="card-img-top img-fluid object-fit-cover"
              [alt]="film.titolo"
            />
          </a>

          <!-- Contenuti solo su desktop (>=992px) -->
          <div
            class="card-body d-flex flex-column justify-content-between d-none d-lg-flex"
          >
            <div>
              <h5 class="card-title">{{ film.titolo }}</h5>
              <p class="card-text"><strong>{{ film.genere }}</strong></p>
            </div>
            <a
              [routerLink]="['/film', film.id]"
              class="btn btn-outline-danger mt-3"
              >Dettagli</a
            >
          </div>
        </div>
      </ng-container>
    </div>

    <!-- Bottone destro -->
    <button
      class="btn btn-outline-light carousel-nav-btn position-absolute top-50 end-0 translate-middle-y"
      (click)="scrollRight()"
    >
      <i class="bi bi-chevron-right fs-3"></i>
    </button>
  </div>
</div>
